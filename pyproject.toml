[project]
name = "earnings-sentiment"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "pyarrow>=16.0.0",
    "transformers>=4.41",
    "torch>=2.0; platform_system != 'Darwin'",
    "pyyaml>=6.0.2",
    "matplotlib>=3.7",
    "ipython>=8.0",
    "ipykernel",
    "nbformat",
    "nbconvert",
    "pre-commit",
    "ruff",
    "black",
    "pytest",
    "yfinance>=0.2.40",
    "kaggle>=1.6.17",
    "datasets>=3.0.0",
    "huggingface_hub>=0.23.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
